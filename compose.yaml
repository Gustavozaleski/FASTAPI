services:
  dockerfast:
    pull_policy: never
    image: dockerfast:latest
    container_name: dockerfast
    hostname: dockerfast
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - 8000:8000
    env_file:
      - ./.env

    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app

          ignore:
            - .venv/
            - __pycache__/

        - action: rebuild
          path: ./uv.lock

